name: Build & Publish Desktop OTA

# Builds the PRIVATE dilarion-appK desktop source and publishes a signed,
# public release (with latest.json) here in dilarion-releases. Run it manually
# from the Actions tab after tagging the source.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag or branch in dilarion-appK to build (e.g. v1.0.0 or main)"
        required: true
        default: "main"
      tag:
        description: "Release tag to publish here (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout private source (dilarion-appK)
        uses: actions/checkout@v4
        with:
          repository: Dev-Ryuzakii/dilarion-appK
          ref: ${{ github.event.inputs.ref }}
          token: ${{ secrets.SOURCE_REPO_TOKEN }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./desktop/src-tauri -> target"

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        working-directory: ./desktop
        run: npm ci

      - name: Build, sign and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: ./desktop
          tagName: ${{ github.event.inputs.tag }}
          releaseName: "Dilarion ${{ github.event.inputs.tag }}"
          releaseBody: "Automated production release. The desktop app updates to this version over the air."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}
